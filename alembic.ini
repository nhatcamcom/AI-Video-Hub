# Alembic config. KEEP THIS FILE ASCII-ONLY: Alembic reads it with the OS locale encoding
# (cp1258 on Vietnamese Windows), so non-ASCII comments break every alembic command.
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL from Settings (.env).
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
