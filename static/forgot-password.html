<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu — AI Video Hub</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/forms.css">
    <script type="module" src="/static/js/forgotPasswordPage.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Bỏ qua tới nội dung chính</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/">AI Video Hub</a>
        <span class="badge badge--demo">Bản demo</span>
        <nav id="session-nav" class="session" aria-label="Tài khoản" data-state="loading">
          <p class="session__view" data-session-view="loading">Đang kiểm tra đăng nhập…</p>
          <div class="session__view" data-session-view="anonymous" hidden>
            <a id="session-login-link" class="session__link" href="/login">Đăng nhập</a>
            <a class="button button--secondary" href="/register">Đăng ký</a>
          </div>
          <div class="session__view" data-session-view="authenticated" hidden>
            <span class="session__user">Xin chào, <strong id="session-user-name"></strong></span>
            <button id="logout-button" class="button button--secondary" type="button">Đăng xuất</button>
          </div>
          <p class="session__view" data-session-view="error" hidden>Chưa kiểm tra được trạng thái đăng nhập.</p>
        </nav>
      </div>
    </header>
    <p id="session-message" class="session-message" role="status" aria-live="polite"></p>

    <main id="main-content" class="page page--narrow" tabindex="-1">
      <div class="page__header">
        <h1 class="page__title">Quên mật khẩu</h1>
        <p class="page__lead">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
      </div>

      <section id="forgot-section" class="panel" aria-label="Biểu mẫu quên mật khẩu">
        <form id="forgot-password-form" class="form" method="post" data-status="forgot-status">
          <div class="field">
            <label class="field__label" for="forgot-email">Email</label>
            <input id="forgot-email" class="field__input" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="forgot-email-error">
            <p id="forgot-email-error" class="field__error" hidden></p>
          </div>
          <div class="form__actions">
            <button class="button" type="submit">Gửi liên kết đặt lại</button>
          </div>
        </form>
        <div class="form__links">
          <p>Nhớ ra mật khẩu? <a class="link" href="/login">Đăng nhập</a></p>
        </div>
      </section>

      <div id="forgot-status" role="status" aria-live="polite">
        <div class="form-status" hidden>
          <p data-status-text></p>
        </div>
      </div>
    </main>
  </body>
</html>
